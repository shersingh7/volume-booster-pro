<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Booster Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app" data-state="loading" data-band="normal">
    <div class="bg-accent" aria-hidden="true"></div>

    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Volume Booster Pro</span>
          <span class="brand-sub">Per-tab control</span>
        </div>
      </div>
      <div
        class="status-pill"
        id="statusPill"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label" id="statusLabel">Loading</span>
      </div>
    </header>

    <main class="main">
      <section class="meter-section" aria-labelledby="volumeReadout">
        <div class="meter-row">
          <div class="readout" id="volumeReadout">
            <span class="readout-value" id="volumeValue">100</span>
            <span class="readout-unit" aria-hidden="true">%</span>
          </div>
          <div class="meter-ring" aria-hidden="true">
            <svg class="meter-svg" viewBox="0 0 80 80">
              <circle class="meter-track" cx="40" cy="40" r="32"></circle>
              <circle class="meter-progress" id="ringProgress" cx="40" cy="40" r="32"></circle>
            </svg>
          </div>
        </div>

        <div class="slider-block">
          <label class="slider-label" for="volumeSlider">Volume level</label>
          <div class="slider-track-wrap">
            <div class="slider-fill" id="sliderFill" aria-hidden="true"></div>
            <div class="slider-marker" style="left: 16.666%" title="100%" aria-hidden="true"></div>
            <input
              type="range"
              class="slider"
              id="volumeSlider"
              min="0"
              max="600"
              value="100"
              step="5"
              aria-valuemin="0"
              aria-valuemax="600"
              aria-valuenow="100"
              aria-valuetext="100 percent"
              aria-describedby="statusDetail highBoostWarning"
            >
          </div>
          <div class="slider-scale" aria-hidden="true">
            <span>0%</span>
            <span class="scale-normal">100%</span>
            <span>600%</span>
          </div>
        </div>

        <p class="status-detail" id="statusDetail">Checking this tab…</p>

        <div class="high-boost-warning" id="highBoostWarning" hidden>
          High boost may distort audio. Lower the level if you hear clipping.
        </div>
      </section>

      <section class="presets-section" aria-label="Quick presets">
        <h2 class="section-heading">Presets</h2>
        <div class="presets-grid" role="group" aria-label="Volume presets">
          <button type="button" class="preset-btn" data-value="0" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            </svg>
            <span class="preset-name">Mute</span>
            <span class="preset-value">0%</span>
          </button>
          <button type="button" class="preset-btn" data-value="100" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            </svg>
            <span class="preset-name">Normal</span>
            <span class="preset-value">100%</span>
          </button>
          <button type="button" class="preset-btn" data-value="200" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span class="preset-name">Boost</span>
            <span class="preset-value">200%</span>
          </button>
          <button type="button" class="preset-btn" data-value="400" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <span class="preset-name">Loud</span>
            <span class="preset-value">400%</span>
          </button>
          <button type="button" class="preset-btn preset-max" data-value="600" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <span class="preset-name">Max</span>
            <span class="preset-value">600%</span>
          </button>
        </div>
      </section>

      <section class="tab-card" aria-label="Active tab">
        <div class="tab-favicon-wrap">
          <img class="tab-favicon" id="tabFavicon" alt="" width="32" height="32" hidden>
          <div class="tab-favicon-fallback" id="tabFaviconFallback" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20"></path>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
        </div>
        <div class="tab-details">
          <div class="tab-title" id="tabTitle">Loading…</div>
          <div class="tab-domain" id="tabDomain">—</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <button type="button" class="reset-btn" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        Reset this tab
      </button>
      <p class="keyboard-hint" id="keyboardHint">
        <kbd aria-hidden="true">↑</kbd><kbd aria-hidden="true">↓</kbd>
        <span>adjust when focused</span>
      </p>
    </footer>
  </div>

  <script src="volume-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
