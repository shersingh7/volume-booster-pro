<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Booster Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="chassis" id="app" data-state="loading" data-band="normal">
    <div class="chassis-texture" aria-hidden="true"></div>

    <!-- Compact brand + LED status header -->
    <header class="rack-header">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">VBP</span>
        <div class="brand-lines">
          <span class="brand-name">VOLUME BOOSTER</span>
          <span class="brand-sub">PRO · PER-TAB GAIN</span>
        </div>
      </div>
      <div
        class="led-status"
        id="statusPill"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="led-cluster" aria-hidden="true">
          <span class="led led-pwr"></span>
          <span class="led led-sig"></span>
        </span>
        <span class="led-label" id="statusLabel">Loading</span>
      </div>
    </header>

    <main class="rack-main">
      <!-- Dominant LCD readout + fader -->
      <section class="lcd-module" aria-labelledby="volumeReadout">
        <div class="lcd-bezel">
          <div class="lcd-screen">
            <div class="lcd-toprow">
              <span class="lcd-tag">OUTPUT</span>
              <span class="lcd-band" id="bandLabel" aria-hidden="true">NORMAL</span>
            </div>
            <div class="readout" id="volumeReadout">
              <span class="readout-value" id="volumeValue">100</span>
              <span class="readout-unit" aria-hidden="true">%</span>
            </div>
            <div class="lcd-meter" aria-hidden="true">
              <div class="lcd-meter-fill" id="sliderFill"></div>
              <div class="lcd-meter-tick" style="left: 16.666%"></div>
            </div>
          </div>
        </div>

        <div class="fader-block">
          <div class="fader-rail-labels" aria-hidden="true">
            <span>0</span>
            <span class="fader-normal-mark">100</span>
            <span>600</span>
          </div>
          <label class="fader-label" for="volumeSlider">Volume level</label>
          <div class="fader-track-wrap">
            <div class="fader-channel" aria-hidden="true">
              <div class="fader-channel-fill" id="faderChannelFill"></div>
              <div class="fader-notch" style="left: 16.666%" title="100%"></div>
            </div>
            <input
              type="range"
              class="fader"
              id="volumeSlider"
              min="0"
              max="600"
              value="100"
              step="5"
              aria-valuemin="0"
              aria-valuemax="600"
              aria-valuenow="100"
              aria-valuetext="100 percent"
              aria-describedby="statusDetail highBoostWarning"
            >
          </div>
          <div class="fader-scale" aria-hidden="true">
            <span>MUTE</span>
            <span class="scale-normal">UNITY</span>
            <span>MAX</span>
          </div>
        </div>

        <p class="status-detail" id="statusDetail">Checking this tab…</p>

        <div class="caution-strip" id="highBoostWarning" hidden>
          <span class="caution-mark" aria-hidden="true">!</span>
          <span class="caution-text">High boost may distort audio. Lower the level if you hear clipping.</span>
        </div>
      </section>

      <!-- Preset bank — hardware switch row -->
      <section class="preset-bank" aria-label="Quick presets">
        <div class="module-label-row">
          <h2 class="module-label">PRESET BANK</h2>
          <span class="module-label-aux" aria-hidden="true">MEMORY</span>
        </div>
        <div class="preset-switches" role="group" aria-label="Volume presets">
          <button type="button" class="preset-btn" data-value="0" aria-pressed="false">
            <span class="switch-cap" aria-hidden="true"></span>
            <span class="preset-name">MUTE</span>
            <span class="preset-value">0</span>
          </button>
          <button type="button" class="preset-btn" data-value="100" aria-pressed="true">
            <span class="switch-cap" aria-hidden="true"></span>
            <span class="preset-name">NORM</span>
            <span class="preset-value">100</span>
          </button>
          <button type="button" class="preset-btn" data-value="200" aria-pressed="false">
            <span class="switch-cap" aria-hidden="true"></span>
            <span class="preset-name">BOOST</span>
            <span class="preset-value">200</span>
          </button>
          <button type="button" class="preset-btn" data-value="400" aria-pressed="false">
            <span class="switch-cap" aria-hidden="true"></span>
            <span class="preset-name">LOUD</span>
            <span class="preset-value">400</span>
          </button>
          <button type="button" class="preset-btn preset-max" data-value="600" aria-pressed="false">
            <span class="switch-cap" aria-hidden="true"></span>
            <span class="preset-name">MAX</span>
            <span class="preset-value">600</span>
          </button>
        </div>
      </section>

      <!-- Compact active-tab strip -->
      <section class="tab-strip" aria-label="Active tab">
        <div class="tab-favicon-wrap">
          <img class="tab-favicon" id="tabFavicon" alt="" width="28" height="28" hidden>
          <div class="tab-favicon-fallback" id="tabFaviconFallback" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20"></path>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
        </div>
        <div class="tab-details">
          <div class="tab-title" id="tabTitle">Loading…</div>
          <div class="tab-domain" id="tabDomain">—</div>
        </div>
        <span class="tab-ch" aria-hidden="true">CH</span>
      </section>
    </main>

    <footer class="rack-footer">
      <button type="button" class="reset-btn" id="resetBtn">
        Reset this tab
      </button>
      <p class="keyboard-hint" id="keyboardHint">
        <kbd aria-hidden="true">↑</kbd><kbd aria-hidden="true">↓</kbd>
        <span>adjust</span>
      </p>
    </footer>
  </div>

  <script src="volume-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
